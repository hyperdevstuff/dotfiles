[mgr]
sort_by = "natural"
show_hidden = true
show_symlink = true
linemode = "size"
ratio = [1, 3, 4]

[opener]
edit = [{ run = 'nvim "$@"', block = true, for = "unix" }]
play = [{ run = 'mpv "$@" --speed=1.25', orphan = true }]
open = [{ run = 'xdg-open "$@"', desc = "Open with default app" }]
pdf = [{ run = 'zathura "$@"', desc = "zathura", orphan = true }]
image = [{ run = 'imv "$@"', desc = "imv", orphan = true }]
archive = [{ run = 'aunpack "$@"', desc = "Extract archive" }]
reveal = [{ run = 'xdg-open "$(dirname "$1")"', desc = "Reveal in file manager" }]
hex = [{ run = 'hexyl "$@" | less -R', desc = "hexyl", block = true }]
glow = [{ run = 'glow "$@"', desc = "glow", block = true }]

[open]
rules = [
  { name = "*.gif", use = ["image"] },
  { name = "*.png", use = ["image"] },
  { name = "*.jpg", use = ["image"] },
  { name = "*.jpeg", use = ["image"] },
  { name = "*.webp", use = ["image"] },
  { name = "*.bmp", use = ["image"] },
  { name = "*.svg", use = ["image"] },
  { name = "*.ico", use = ["image"] },
  { name = "*.pdf", use = ["pdf"] },
  { name = "*.7z", use = ["archive"] },
  { name = "*.zip", use = ["archive"] },
  { name = "*.tar*", use = ["archive"] },
  { name = "*.gz", use = ["archive"] },
  { name = "*.xz", use = ["archive"] },
  { name = "*.bz2", use = ["archive"] },
  { name = "*.rar", use = ["archive"] },
  { name = "*.mkv", use = ["play"] },
  { name = "*.mp4", use = ["play"] },
  { name = "*.webm", use = ["play"] },
  { name = "*.avi", use = ["play"] },
  { name = "*.mov", use = ["play"] },
  { name = "*.flac", use = ["play"] },
  { name = "*.mp3", use = ["play"] },
  { name = "*.wav", use = ["play"] },
  { name = "*.ogg", use = ["play"] },
  { name = "*.opus", use = ["play"] },
  { name = "*.m4a", use = ["play"] },
  { name = "*.md", use = ["glow"] },
]

[plugin]
prepend_previewers = [
  { name = "*.md", run = "glow" },
  { name = "*.json", run = "json" },
  { name = "*/", run = "folder" },
]
